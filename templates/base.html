<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OOP Purity Analyzer — Quantitatively measure OOP purity across GitHub repositories using a 7-category, 24-sub-criterion academic scoring framework.">
    <title>{% block title %}OOP Purity Analyzer{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar" id="main-navbar">
        <div class="nav-container">
            <a href="{{ url_for('index') }}" class="nav-brand" id="nav-brand">
                <span class="brand-icon">◆</span>
                <span class="brand-text">OOP Purity Analyzer</span>
            </a>
            <div class="nav-links" id="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link" id="nav-home">Home</a>
                <a href="{{ url_for('rubric') }}" class="nav-link" id="nav-rubric">Rubric</a>
                <a href="{{ url_for('history') }}" class="nav-link" id="nav-history">History</a>
                <a href="https://github.com" class="nav-link" target="_blank" rel="noopener" id="nav-github">GitHub ↗</a>
            </div>
            <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer" id="main-footer">
        <div class="footer-container">
            <p class="footer-text">Academic Research Tool — OOP Purity Framework</p>
            <p class="footer-sub">Quantitative analysis of object-oriented programming purity across languages</p>
        </div>
    </footer>

    <!-- Mobile nav toggle script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.getElementById('nav-toggle');
            const links = document.getElementById('nav-links');
            if (toggle && links) {
                toggle.addEventListener('click', function() {
                    links.classList.toggle('active');
                    toggle.classList.toggle('active');
                });
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
